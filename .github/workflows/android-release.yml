name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example, v1.6.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_FILE: release.jks
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          trap 'rm -f app/release.jks' EXIT

          : "${KEYSTORE_BASE64:?Missing KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD}"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.jks
          test -s app/release.jks
          ./gradlew lintDebug testDebugUnitTest assembleRelease

          VERSION_NAME="${TAG_NAME#v}"
          VERSION_CODE="$(git rev-list --count HEAD)"
          APK_NAME="JUAR4M-v${VERSION_NAME}-build${VERSION_CODE}.apk"
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK_NAME"
          echo "Built $APK_NAME"

      - name: Remove previous generic APK asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release delete-asset "$RELEASE_TAG" app-release.apk --yes || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: app/build/outputs/apk/release/JUAR4M-*.apk
